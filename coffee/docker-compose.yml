version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0-alpine
    container_name: coffee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffee}
      MYSQL_USER: ${MYSQL_USER:-coffee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coffee}
      TZ: 'America/Sao_Paulo'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - coffee-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: coffee-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-guest}
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - coffee-network

  # Coffee Application
  coffee-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: .
    container_name: coffee-app
    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev-mysql}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-coffee}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-coffee}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-coffee}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}

      # Server
      SERVER_PORT: ${SERVER_PORT:-8080}

      # RabbitMQ
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_USER: ${RABBIT_USER:-guest}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-coffee.exchange}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-fechamento.caixa.queue}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-fechamento.caixa}

      # Security
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - coffee-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  coffee-network:
    driver: bridge

