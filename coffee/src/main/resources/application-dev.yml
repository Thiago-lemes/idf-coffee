spring:
  datasource:
    url: jdbc:h2:mem:coffee;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false # migrations are Postgres-specific; disable in dev to avoid failures

# Token secret used by TokenService; provide a sensible default for dev/test
api:
  security:
    token:
      secret: change_this_dev_secret

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
